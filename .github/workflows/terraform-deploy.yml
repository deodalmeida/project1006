name: Terraform Deploy

# PR            -> plan only (read-only role), plan shown in the job summary
# push to main  -> plan, then apply of that exact saved plan after a human
#                  approves the "production" environment
# manual run    -> same as push to main
#
# Repository variables required (Settings > Secrets and variables > Variables):
#   AWS_REGION, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN
# No AWS keys are stored in GitHub: credentials come from OIDC.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One state file, so never run two Terraform jobs at once; queue, don't cancel.
concurrency:
  group: terraform-project1006
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # 0 = no changes, 2 = changes, anything else = error
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish plan to job summary
        if: always() && steps.plan.outcome == 'success'
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan"
            echo
            echo '```'
            grep -E '^\s*(#|Plan:|No changes)' plan.txt || true
            echo '```'
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only pushes to main / manual runs can be applied, so only they keep the
      # plan. Short retention: plan files can contain resource attributes.
      - name: Upload plan
        if: github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply (requires approval)
    needs: plan
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the job until approved.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      # Applies exactly what the reviewer approved. If state changed since the
      # plan, Terraform rejects the stale plan instead of applying something else.
      - name: terraform apply
        run: terraform apply -no-color tfplan
